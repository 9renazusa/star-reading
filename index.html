<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAR READING — 英語 × 西洋占星術</title>
<meta name="description" content="自分の出生チャートを題材に、英語と西洋占星術を同時に学ぶ学習アプリ。">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="wordmark">STAR READING</div>
  <p class="tagline">英語で読む、自分の星。</p>
  <nav class="main-nav" id="main-nav">
    <button type="button" data-view="home">HOME</button>
    <button type="button" data-view="chart">CHART</button>
    <button type="button" data-view="profile">PROFILE</button>
    <button type="button" data-view="today">TODAY</button>
    <button type="button" data-view="setup">BIRTH DATA</button>
  </nav>
  <div class="status-bar" id="status-bar"></div>
</header>

<main>
  <section id="view-home" class="view"></section>
  <section id="view-setup" class="view" hidden></section>
  <section id="view-chart" class="view" hidden></section>
  <section id="view-profile" class="view" hidden></section>
  <section id="view-today" class="view" hidden></section>
  <section id="view-lesson" class="view" hidden></section>
</main>

<footer class="site-footer">
  <p>出生データはこのブラウザの中（localStorage）にだけ保存され、外部に送信されることはありません。</p>
  <p class="credit">Planet positions: Astronomy Engine (MIT License, © Don Cross). Houses: Placidus, self-implemented.</p>
</footer>

<script src="vendor/astronomy-engine.js"></script>
<script src="js/chart.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
